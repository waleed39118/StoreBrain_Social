name: Ada CI

on:
  push:
    branches: [main, "claude/**"]
    tags: ["ada-v*"]
    paths: ["ada/**", ".github/workflows/ada.yml"]
  pull_request:
    paths: ["ada/**", ".github/workflows/ada.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ada-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ada

jobs:
  backend:
    name: Backend tests + security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip, cache-dependency-path: ada/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - name: Unit + API tests
        run: python -m pytest -q
      - name: Migrations match models
        env: { ADA_DATABASE_URL: "sqlite:////tmp/ci.db" }
        run: alembic upgrade head && alembic check
      - name: Bandit (static security analysis)
        run: bandit -q -r app -c pyproject.toml
      - name: pip-audit (known vulnerabilities in dependencies)
        run: pip-audit -r requirements.txt --strict
      - name: Semgrep (OWASP rules for Python, JavaScript, secrets)
        run: |
          pip install semgrep
          semgrep scan --config p/python --config p/javascript --config p/secrets --config p/owasp-top-ten \
            --metrics=off --error app web/js

  e2e:
    name: Browser end-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip, cache-dependency-path: ada/requirements*.txt }
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - run: pip install -r requirements.txt
      - run: npm install --no-save playwright@1 && npx playwright install --with-deps chromium
        working-directory: ada/tests/e2e
      - name: Run E2E
        run: |
          tests/e2e/run_server.sh > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/health && break; sleep 1; done
          mkdir -p /tmp/shots
          cd tests/e2e
          SHOTS=/tmp/shots node pwa.e2e.mjs
          node offline_shell.e2e.mjs        # same server: only needs the login page
      - if: always()
        uses: actions/upload-artifact@v5
        with: { name: e2e-screenshots, path: /tmp/shots, if-no-files-found: ignore }

  local-ai:
    name: Local AI integration (real Ollama model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip, cache-dependency-path: ada/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - name: Start Ollama and pull a small model
        run: |
          docker run -d --name ollama -p 127.0.0.1:11434:11434 ollama/ollama:latest
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:11434/api/tags && break; sleep 2; done
          docker exec ollama ollama pull qwen2.5:1.5b
      - name: Real-model intent classification (Arabic dialects + English)
        env: { ADA_TEST_LLM_URL: "http://127.0.0.1:11434", ADA_TEST_LLM_MODEL: "qwen2.5:1.5b" }
        run: python -m pytest -q -s tests/integration

  android:
    name: Android SMS gateway APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ada/android-gateway
    steps:
      - uses: actions/checkout@v5
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.ADA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ada.jks"
          else
            keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/ada.jks" -storepass ci-ephemeral -keypass ci-ephemeral \
              -alias ada -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=Ada CI ephemeral"
            echo "::warning::ADA_KEYSTORE_B64 secret not set: APK signed with a throw-away CI key (OK for testing; set ADA_KEYSTORE_B64/ADA_KEYSTORE_PASSWORD/ADA_KEY_ALIAS/ADA_KEY_PASSWORD for releases so updates keep the same signature)."
          fi
          echo "ADA_KEYSTORE_FILE=$RUNNER_TEMP/ada.jks" >> "$GITHUB_ENV"
      - name: Build release APK
        env:
          ADA_KEYSTORE_PASSWORD: ${{ secrets.ADA_KEYSTORE_PASSWORD || 'ci-ephemeral' }}
          ADA_KEY_ALIAS: ${{ secrets.ADA_KEY_ALIAS || 'ada' }}
          ADA_KEY_PASSWORD: ${{ secrets.ADA_KEY_PASSWORD || 'ci-ephemeral' }}
        run: ./gradlew --no-daemon assembleRelease lint
      - uses: actions/upload-artifact@v5
        with:
          name: ada-sms-gateway-apk
          path: |
            ada/android-gateway/app/build/outputs/apk/release/*.apk
            ada/android-gateway/app/build/reports/lint-results-*.html

  release:
    name: Publish release (tags ada-v*)
    if: startsWith(github.ref, 'refs/tags/ada-v')
    needs: [backend, e2e, android]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with: { name: ada-sms-gateway-apk, path: dist }
      - run: gh release create "$GITHUB_REF_NAME" ../dist/**/*.apk --title "Ada $GITHUB_REF_NAME" --generate-notes
        env: { GH_TOKEN: "${{ github.token }}" }
